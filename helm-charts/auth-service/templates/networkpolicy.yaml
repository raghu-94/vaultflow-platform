apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all, namespace: production }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: auth-service-netpol, namespace: production }
spec:
  podSelector: { matchLabels: { app: auth-service } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
      ports: [{ protocol: TCP, port: 3000 }]
    # ← also allow inbound from order-service (same namespace); required for inter-service JWT validation
    - from: [{ podSelector: { matchLabels: { app: order-service } } }]
      ports: [{ protocol: TCP, port: 3000 }]
  egress: [{ to: [], ports: [{ protocol: UDP, port: 53 }] }, { to: [{ podSelector: { matchLabels: { app: order-service } } }], ports: [{ protocol: TCP, port: 3001 }] }]
