apiVersion: v1
kind: ServiceAccount
metadata: { name: auth-service, namespace: {{ .Release.Namespace }} }
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: auth-service-role, namespace: {{ .Release.Namespace }} }
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: auth-service-rolebinding, namespace: {{ .Release.Namespace }} }
subjects: [{ kind: ServiceAccount, name: auth-service }]
roleRef: { kind: Role, name: auth-service-role, apiGroup: rbac.authorization.k8s.io }
