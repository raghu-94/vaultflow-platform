apiVersion: external-secrets.io/v1
kind: ClusterSecretStore   # NOT "SecretStore" — that's namespace-scoped and its serviceAccountRef must live in the SAME namespace; our ESO service account lives in "external-secrets", so this must be cluster-scoped
metadata:
  name: aws-secretsmanager   # no "namespace:" field — ClusterSecretStore is cluster-scoped
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
  # ^ IRSA — pod identity via the OIDC provider created by EKS module
