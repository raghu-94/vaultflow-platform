apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: production
  labels:
    app: auth-service
    version: blue                   # used for blue/green in Phase 6
spec:
  replicas: 2                       # 2 pods for availability
  selector:
    matchLabels:
      app: auth-service
      version: blue
  template:
    metadata:
      labels:
        app: auth-service
        version: blue
    spec:
      serviceAccountName: auth-service   # binds to SA from rbac.yaml in Step 3.3
      containers:
      - name: auth-service
        image: 793001766848.dkr.ecr.ap-south-1.amazonaws.com/auth-service:v1.0.0
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m               # 0.1 CPU core minimum
            memory: 128Mi
          limits:
            cpu: 500m               # 0.5 CPU core maximum
            memory: 256Mi
        livenessProbe:              # restart pod if /health fails
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:             # stop sending traffic until pod is ready
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: production
spec:
  selector:
    app: auth-service
    version: blue             # routes traffic only to blue pods
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
