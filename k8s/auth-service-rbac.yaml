apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: production
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: auth-service-role
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: auth-service-rolebinding
  namespace: production
subjects: [{ kind: ServiceAccount, name: auth-service }]
roleRef: { kind: Role, name: auth-service-role, apiGroup: rbac.authorization.k8s.io }
